---
# K3s Cluster Orchestration Playbook

- name: Bootstrap K3s Control Plane / Master Node
  hosts: k3s_master
  become: yes
  gather_facts: yes
  roles:
    - role: k3s

- name: Bootstrap and Join K3s Worker Nodes
  hosts: k3s_workers
  become: yes
  gather_facts: yes
  roles:
    - role: k3s

- name: Verify K3s Cluster Health and Nodes
  hosts: k3s_master
  become: yes
  gather_facts: no
  tasks:
    - name: Run verification tasks
      ansible.builtin.include_tasks: ../roles/k3s/tasks/verify.yml
