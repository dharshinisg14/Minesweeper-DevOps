# ========================================================
# Ansible Inventory for Minesweeper K3s Cluster
# Auto-generated by Terraform or configured manually
# ========================================================

[k3s_master]
master ansible_host=127.0.0.1 private_ip=10.0.1.10 node_name=k3s-master

[k3s_workers]
worker-1 ansible_host=127.0.0.1 private_ip=10.0.1.20 node_name=k3s-worker-1
worker-2 ansible_host=127.0.0.1 private_ip=10.0.2.20 node_name=k3s-worker-2

[k3s_cluster:children]
k3s_master
k3s_workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=./id_rsa_minesweeper
