apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minesweeper

commonLabels:
  app.kubernetes.io/name: minesweeper
  app.kubernetes.io/part-of: minesweeper-devops
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: devopsdemo/minesweeper-clone
    newName: devopsdemo/minesweeper-clone
    newTag: latest
