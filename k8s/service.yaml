apiVersion: v1
kind: Service
metadata:
  name: minesweeper-service
  namespace: minesweeper
  labels:
    app: minesweeper
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: minesweeper
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
